# Chequeo de tipos + lint del frontend en cada push/PR que lo toque.
#
# tsc --noEmit ya corre dentro de `npm run build`, pero se lista aparte para
# que falle rápido y quede claro en los checks de la PR cuál de los dos rompió.
name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Build de producción
        # vite build directo (no `npm run build`) para no correr tsc dos veces —
        # ya lo cubrió el paso de typecheck de arriba.
        run: npx vite build
